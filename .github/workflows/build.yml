name: Build PEPELUS

on:
  push:
    branches: [ pepelus ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: PEPELUS-Windows
          - name: macOS
            os: macos-15-intel
            artifact: PEPELUS-Mac
          - name: Linux
            os: ubuntu-22.04
            artifact: PEPELUS-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev ninja-build \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:GITHUB_WORKSPACE\nuget" -NonInteractive

      - name: Configurar (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/nuget"

      - name: "Configurar (macOS, universal Apple Silicon + Intel)"
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configurar (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPEPELUS_TOOLS=ON

      - name: Compilar (Windows / Linux)
        if: runner.os != 'macOS'
        run: cmake --build build --config Release --parallel 4 --target Satura_VST3 Slowed_VST3 Ninja_VST3

      - name: "Compilar (macOS, VST3 + AU)"
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --parallel 4 --target Satura_VST3 Slowed_VST3 Ninja_VST3 Satura_AU Slowed_AU Ninja_AU

      - name: Prueba de estrés del sonido (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -O2 -std=c++17 -I Source tools/Stress.cpp -o stress
          ./stress

      - name: Empaquetar
        shell: bash
        run: |
          mkdir -p dist
          for p in Satura Slowed Ninja; do cp -R build/${p}_artefacts/Release/VST3/*.vst3 dist/; done
          if [ "$RUNNER_OS" = "macOS" ]; then
            for p in Satura Slowed Ninja; do cp -R build/${p}_artefacts/Release/AU/*.component dist/; done
            for b in dist/*.vst3 dist/*.component; do codesign --force --deep -s - "$b"; done
          fi
          cp INSTALAR.txt dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

  release:
    name: Publicar descarga
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Comprimir
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qry "../${d%/}.zip" .); done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pepelus-v1.0.${{ github.run_number }}
          name: PEPELUS 1.0 (prueba ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: false
          prerelease: true
          body: |
            PEPELUS SATIVA OPERATIONS: SATURA, SLOWED y NINJA (VST3). VST3 para Windows y Mac, y AU para Logic/GarageBand. Descarga el zip de tu sistema y lee INSTALAR.txt.
          files: artifacts/*.zip
