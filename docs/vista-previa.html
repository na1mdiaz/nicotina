function makeNode() {
  const sr = actx.sampleRate;
  const aF = Math.exp(-1 / (0.001 * sr)), rF = Math.exp(-1 / (0.04 * sr));

      s.crush += (tC - s.crush) * smooth; s.bits += (tB - s.bits) * smooth; s.rate += (tR - s.rate) * smooth;
      s.mix += (tM - s.mix) * smooth; s.gain += (tG - s.gain) * smooth;

        }
        let wet = Math.round(st.held * levels) / levels;
        if (mode === 1) { st.lp1 += (wet - st.lp1) * aLp; st.lp2 += (st.lp1 - st.lp2) * aLp; wet = st.lp2; }           // SP-1200: cálido
        else if (mode === 2) {                                                                                      // RADIO: banda estrecha + siseo
          const hp = aHp * (st.hpOut + wet - st.hpIn); st.hpIn = wet; st.hpOut = hp;
          st.lp1 += (hp - st.lp1) * aLp; st.lp2 += (st.lp1 - st.lp2) * aLp;
          wet = Math.tanh(st.lp2 * 2.2) + (Math.random() - 0.5) * 0.02 * c;
        }
        else if (mode === 3) wet = Math.max(-0.85, Math.min(0.85, wet * 1.4));                                       // DESTROY: recorte duro
        wet *= 1 / (1 + 0.8 * c * c);                       // compensación automática de volumen
        const hp = wet - st.dcIn + 0.9995 * st.dcOut; st.dcIn = wet; st.dcOut = hp; wet = hp;
        wet = dry + (wet - dry) * fade;
        let o = (dry + (wet - dry) * s.mix) * s.gain;
        if (bypass) o = dry;
        if (k) oR[i] = o; else oL[i] = o;
        peak = Math.max(peak, Math.abs(o));
      }
      dsp.envF = mono > dsp.envF ? aF * dsp.envF + (1 - aF) * mono : rF * dsp.envF + (1 - rF) * mono;
      dsp.envS = mono > dsp.envS ? aS * dsp.envS + (1 - aS) * mono : rS * dsp.envS + (1 - rS) * mono;
      if (dsp.hold > 0) dsp.hold--;
      else if (dsp.envF > 0.05 && dsp.envF > dsp.envS * 1.5) { meter.transients++; dsp.hold = holdN; }
    }
    meter.out = Math.max(peak, meter.out * 0.85);
  };
  return n;
}

// Beat de demo: trap oscuro a 140 bpm, generado aquí mismo
function makeDemo(ctx) {
  const sr = ctx.sampleRate, bpm = 140, beat = 60 / bpm, bars = 4, len = Math.floor(beat * 4 * bars * sr);
  const buf = ctx.createBuffer(2, len, sr), L = buf.getChannelData(0), R = buf.getChannelData(1);
  const add = (t0, fn, dur) => { const s0 = Math.floor(t0 * sr), n = Math.floor(dur * sr); for (let i = 0; i < n && s0 + i < len; i++) { const v = fn(i / sr); L[s0 + i] += v; R[s0 + i] += v; } };
  const kick = t => { const f = 45 + 120 * Math.exp(-t * 30); return Math.sin(2 * Math.PI * f * t - 0) * Math.exp(-t * 3.2) * 0.85; };
  const snare = t => ((Math.random() * 2 - 1) * Math.exp(-t * 18) * 0.5 + Math.sin(2 * Math.PI * 190 * t) * Math.exp(-t * 25) * 0.3);
  const hat = t => (Math.random() * 2 - 1) * Math.exp(-t * 90) * 0.18;
  const step = beat / 4;
  const kicks = [0, 6, 10, 16, 22, 24, 27, 32, 38, 42, 48, 54, 57, 59];
  for (let b = 0; b < bars / 2; b++) {
    const off = b * beat * 8;
    kicks.forEach(k => k < 64 && add(off + k * step, kick, 0.9));
    [8, 24, 40, 56].forEach(k => add(off + k * step, snare, 0.3));
    for (let k = 0; k < 64; k += 2) add(off + k * step, hat, 0.08);
    [13, 14, 15, 45, 46, 47].forEach(k => add(off + k * step + step / 2, hat, 0.05));
  }
  // acordes menores oscuros (pad)
  const chords = [[220, 261.6, 329.6], [196, 233.1, 293.7], [174.6, 220, 261.6], [164.8, 196, 246.9]];
  chords.forEach((ch, i) => add(i * beat * 4, t => ch.reduce((s, f) => s + Math.sin(2 * Math.PI * f * t) * 0.06 + Math.sin(2 * Math.PI * f * 2.003 * t) * 0.02, 0) * Math.min(1, t * 6) * Math.min(1, (beat * 4 - t) * 6), beat * 4));
  for (let i = 0; i < len; i++) { L[i] = Math.tanh(L[i] * 1.1); R[i] = Math.tanh(R[i] * 1.1); }
  return buf;
}

function ensureAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  node = makeNode();
  node.connect(actx.destination);
  demoBuf = makeDemo(actx);
}
function startSource(buf, label) {
  stopSource();
  srcNode = actx.createBufferSource();
  srcNode.buffer = buf; srcNode.loop = true;
  srcNode.connect(node); srcNode.start();
  playing = true;
  document.getElementById("status").textContent = "sonando: " + label;
  document.getElementById("play").textContent = "■ PARAR"; document.getElementById("play").classList.add("on");
}
function stopSource() {
  if (srcNode) { try { srcNode.stop(); } catch (e) {} srcNode.disconnect(); srcNode = null; }
  playing = false;
  document.getElementById("play").textContent = userBuf ? "▶ TU AUDIO" : "▶ DEMO"; document.getElementById("play").classList.remove("on");
}
document.getElementById("play").onclick = async () => {
  ensureAudio(); await actx.resume();
  if (playing) { stopSource(); document.getElementById("status").textContent = "parado"; return; }
  startSource(userBuf || demoBuf, userBuf ? userBuf.label : "beat de demo");
};
document.getElementById("bypass").onclick = e => { bypass = !bypass; e.target.classList.toggle("on", bypass); };
document.getElementById("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  ensureAudio(); await actx.resume();
  document.getElementById("status").textContent = "cargando…";
  try {
    userBuf = await actx.decodeAudioData(await f.arrayBuffer());
    userBuf.label = f.name;
    startSource(userBuf, f.name);
  } catch (err) { document.getElementById("status").textContent = "no se pudo leer ese archivo"; }
};
// ---------------------------------------------------------------- escena
const scene = {
  t: 0, crush: 0, level: 0, lvS: 0, press: 0, vel: 0, shake: 0, slammed: false, lastTr: 0,
  ember: 1, glow: 0, pulse: 0, score: 0, combo: 0, comboT: 0, impactT: 0, flashT: 0, glitchT: 0, tobacco: [],
  sparks: [], ash: [], splats: [], puffs: [], petals: [],
};
const EMBER = { x: 206, y: 217 };
const FG = { x: 210, y: 262, k: 1.75, dy: 38 };   // zoom del primer plano (mesa, cenicero, mano)       // punto donde se aplasta el cigarro (dentro del cenicero)

function burst(n, power, kind) {
  for (let i = 0; i < n; i++) {
    const a = rr(-Math.PI * 0.95, -Math.PI * 0.05), sp = rr(60, 280) * power;
    const o = { x: EMBER.x + rr(-8, 8), y: EMBER.y + rr(-4, 2), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rr(0.5, 1.4), max: 1.4, r: rr(0.8, 2.4) };
    (kind === "ash" ? scene.ash : scene.sparks).push(o);
  }
}
function burstTobacco(n, power) {
  for (let i = 0; i < n; i++) {
    const a = rr(-Math.PI * 0.9, -Math.PI * 0.1), sp = rr(40, 200) * power;
    if (scene.tobacco.length < 160) scene.tobacco.push({ x: EMBER.x + rr(-6, 6), y: EMBER.y - rr(0, 6), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rr(0, 6), vr: rr(-12, 12), len: rr(2, 5), life: 1 });
  }
}
function inkSplat() {
  if (scene.splats.length > 40) return;
  const seed = Math.random() * 1e6;
  scene.splats.push({ x: rr(30, SW - 30), y: rr(20, SH - 110), r: rr(6, 15), a: 1, drip: 0, dripV: rr(4, 14), seed });
}

function updateScene(dt) {
  const s = scene;
  dt = Math.min(dt, 0.05);
  s.t += dt;
  s.crush = params.crush.v / 100;
  s.level = Math.min(1.5, meter.out);
  s.lvS += (s.level - s.lvS) * Math.min(1, dt * 10);
  s.pulse = Math.max(s.level, s.pulse - dt * 4);

  const wants = s.crush >= 0.9;
  const target = wants ? 1 : (s.crush / 0.9) * 0.72;
  if (wants && s.press < 1) {
    s.vel += 14 * dt; s.press = Math.min(1, s.press + s.vel * dt);
    if (s.press >= 1 && !s.slammed) {
      s.slammed = true; s.shake = 1; s.impactT = 1; s.flashT = 0.09; s.glitchT = 0.35; s.combo = 0;
      burstTobacco(26, 1.1);
      burst(70, 1.3, "spark"); burst(40, 0.9, "ash");
      for (let i = 0; i < 4; i++) inkSplat();
      for (let i = 0; i < 6; i++) s.puffs.push({ x: EMBER.x + rr(-14, 14), y: EMBER.y - 4, vx: rr(-30, 30), vy: rr(-50, -20), r: rr(6, 10), a: 0.55 });
    }
  } else {
    s.vel = 0;
    s.press += (target - s.press) * Math.min(1, dt * (target < s.press ? 2.5 : 9));
  }
  if (s.crush < 0.86) { s.slammed = false; s.combo = 0; }
  if (s.press > 0.12 && !s.ashBroken) { s.ashBroken = true; burst(16, 0.5, "ash"); }
  if (s.press < 0.05) s.ashBroken = false;
  s.impactT = Math.max(0, s.impactT - dt * 1.4);
  s.flashT = Math.max(0, s.flashT - dt);
  s.glitchT = Math.max(0, s.glitchT - dt);
  s.comboT = Math.max(0, s.comboT - dt); if (s.comboT <= 0) s.combo = 0;
  for (const q of s.tobacco) { q.vy += 420 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt; q.life -= dt * 0.35; if (q.y > 300) { q.y = 300; q.vy *= -0.2; q.vx *= 0.4; q.vr = 0; } }
  s.tobacco = s.tobacco.filter(q => q.life > 0);
  s.shake = Math.max(0, s.shake - dt * 3.5);

  // brasa: se apaga al aplastar del todo, se reaviva al soltar
  s.ember += ((s.slammed ? 0.12 : 1) - s.ember) * Math.min(1, dt * (s.slammed ? 6 : 1.2));
  s.glow += (clamp(s.crush * 1.1 + s.lvS * 0.3 * s.crush, 0, 1) - s.glow) * Math.min(1, dt * 6);

  if (s.slammed) {
    if (meter.transients !== s.lastTr) {
      burst(10 + Math.floor(s.lvS * 28), 0.6 + s.lvS, "spark");
      s.score = (s.score + 10 * (1 + s.combo) + Math.floor(s.lvS * 40)) % 1000000;
      s.combo++; s.comboT = 2; s.glitchT = Math.max(s.glitchT, 0.12 + 0.12 * s.lvS);
      if (s.lvS > 0.5) s.flashT = Math.max(s.flashT, 0.04);
      burstTobacco(4 + Math.floor(s.lvS * 8), 0.6);
      burst(6 + Math.floor(s.lvS * 10), 0.5 + s.lvS * 0.5, "ash");
      s.shake = Math.max(s.shake, 0.35 + 0.4 * s.lvS);
      if (Math.random() < 0.55) { inkSplat(); if (Math.random() < 0.4) inkSplat(); }
    }
    if (Math.random() < dt * (2 + s.lvS * 20)) burst(1 + (Math.random() * 3 | 0), 0.35, "spark");
  } else if (Math.random() < dt * (0.6 + s.lvS * 4) * s.ember) burst(1, 0.15, "spark");
  s.lastTr = meter.transients;

  for (const p of s.sparks) { p.vy += 380 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.y > 300) { p.y = 300; p.vy *= -0.3; p.vx *= 0.5; } }
  for (const p of s.ash) { p.vy += 160 * dt; p.vx *= 0.97; p.x += p.vx * dt + Math.sin(s.t * 4 + p.r * 10) * 8 * dt; p.y += p.vy * dt; p.life -= dt * 0.5; if (p.y > 300) { p.y = 300; p.vy = 0; p.vx = 0; } }
  s.sparks = s.sparks.filter(p => p.life > 0);
  s.ash = s.ash.filter(p => p.life > 0);

  for (const sp of s.splats) { sp.drip = Math.min(90, sp.drip + sp.dripV * dt); sp.dripV = Math.max(0, sp.dripV - dt * 1.5); sp.a -= dt * (s.slammed ? 0.1 : 1.1); }
  s.splats = s.splats.filter(sp => sp.a > 0);

  // humo de la brasa
  if (Math.random() < dt * (3 + s.lvS * 12) * (0.25 + 0.75 * s.ember))
    s.puffs.push({ x: EMBER.x + rr(-2, 2), y: EMBER.y - 3, vx: rr(-8, 8), vy: rr(-36, -22), r: rr(2.5, 4.5), a: rr(0.25, 0.45) });
  for (const p of s.puffs) { p.x += p.vx * dt + Math.sin(s.t * 1.8 + p.y * 0.05) * 10 * dt; p.y += p.vy * dt; p.r += dt * 8; p.a -= dt * 0.16; }
  s.puffs = s.puffs.filter(p => p.a > 0);

  // pétalos de sakura
  if (Math.random() < dt * 0.9 && s.petals.length < 14)
    s.petals.push({ x: rr(0, SW), y: -8, vx: rr(4, 16), vy: rr(14, 26), rot: rr(0, 6.28), vr: rr(-2, 2), life: 1 });
  for (const p of s.petals) { p.x += (p.vx + Math.sin(s.t * 2 + p.rot) * 10) * dt; p.y += p.vy * dt; p.rot += p.vr * dt; if (p.y > 300) p.life -= dt * 0.6; }
  s.petals = s.petals.filter(p => p.life > 0 && p.x < SW + 10);
}

function lantern(x, top, kanji, phase) {
  const s = scene;
  const sway = Math.sin(s.t * 1.3 + phase) * 0.05 + Math.sin(s.t * 9) * s.pulse * 0.025;
  const cordL = 18;
  ctx.save();
  ctx.translate(x, top); ctx.rotate(sway);
  ctx.strokeStyle = g(20); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, -top); ctx.lineTo(0, cordL); ctx.stroke();
  const w = 54, h = 76, cy = cordL + 8 + h / 2;
  const glow = 0.35 + 0.65 * Math.min(1, s.pulse * 1.2);
  // halo
  const halo = ctx.createRadialGradient(0, cy, 4, 0, cy, 90);
  halo.addColorStop(0, `rgba(211,18,26,${0.32 * glow})`); halo.addColorStop(1, "rgba(211,18,26,0)");
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, cy, 90, 0, 7); ctx.fill();
  // cuerpo
  const body = ctx.createRadialGradient(-8, cy - 10, 4, 0, cy, w * 0.7);
  body.addColorStop(0, `rgb(${200 + 55 * glow},${40 + 40 * glow},${30 + 20 * glow})`);
  body.addColorStop(0.6, "#a3101a"); body.addColorStop(1, "#4a0508");
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0, cy, w / 2, h / 2, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1;
  for (let i = -3; i <= 3; i++) { const yy = cy + i * h / 8; const ww = (w / 2) * Math.sqrt(1 - Math.pow((yy - cy) / (h / 2), 2)); ctx.beginPath(); ctx.moveTo(-ww, yy); ctx.quadraticCurveTo(0, yy + 3, ww, yy); ctx.stroke(); }
  // kanji
  ctx.fillStyle = "rgba(10,10,10,.92)"; ctx.font = "36.5px NDot"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(kanji, 0, cy + 2);
  // tapas
  ctx.fillStyle = g(14);
  ctx.fillRect(-15, cordL + 2, 30, 8); ctx.fillRect(-15, cy + h / 2 - 2, 30, 8);
  ctx.fillStyle = g(60); ctx.fillRect(-15, cordL + 2, 30, 1.5); ctx.fillRect(-15, cy + h / 2 - 2, 30, 1.5);
  // borla
  ctx.strokeStyle = RED_D; ctx.lineWidth = 1;
  for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(0, cy + h / 2 + 6); ctx.lineTo(i * 1.4 + Math.sin(s.t * 3 + i) * 0.8, cy + h / 2 + 22); ctx.stroke(); }
  ctx.restore();
}

  if (!front) {

    ctx.fillStyle = g(70); ctx.beginPath(); ctx.ellipse(cx, 218, 46, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = g(18); ctx.beginPath(); ctx.ellipse(cx, 219, 38, 6.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = g(70, 0.9); ctx.beginPath(); ctx.ellipse(cx + 2, 220, 26 + scene.press * 6, 4, 0, 0, 7); ctx.fill();
    // colillas viejas
    ctx.fillStyle = g(200); ctx.save(); ctx.translate(cx - 22, 219); ctx.rotate(0.15); ctx.fillRect(0, -1.5, 12, 3); ctx.fillStyle = "#b9a58a"; ctx.fillRect(9, -1.5, 5, 3); ctx.restore();
    ctx.fillStyle = g(200); ctx.save(); ctx.translate(cx + 14, 221); ctx.rotate(-0.3); ctx.fillRect(0, -1.5, 10, 3); ctx.fillStyle = "#b9a58a"; ctx.fillRect(-4, -1.5, 5, 3); ctx.restore();
    return;
  }
  // cuerpo delantero de cristal grueso
  const gr = ctx.createLinearGradient(cx - 46, 0, cx + 46, 0);
  gr.addColorStop(0, g(40)); gr.addColorStop(0.3, g(150)); gr.addColorStop(0.45, g(80)); gr.addColorStop(1, g(28));
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.moveTo(cx - 46, 218); ctx.ellipse(cx, 218, 46, 9, 0, Math.PI, 0, true); ctx.lineTo(cx + 42, 234); ctx.ellipse(cx, 234, 42, 6, 0, 0, Math.PI); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = g(0, 0.7); ctx.lineWidth = 1; ctx.stroke();
  // muescas
  ctx.fillStyle = g(14);
  for (const dx of [-30, 30]) { ctx.beginPath(); ctx.ellipse(cx + dx, 225, 5, 3, 0, 0, 7); ctx.fill(); }
  ctx.strokeStyle = g(230, 0.5); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(cx, 218, 46, 9, 0, 0.1, Math.PI - 0.1); ctx.stroke();
  // kanji grabado
  ctx.fillStyle = "rgba(211,18,26,.85)"; ctx.font = "12px NYuji, serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("九", cx, 229);
}

// Geometría del cigarro. p 0..1 = cuánto ha presionado la mano.
// Como al apagar uno de verdad: se empuja recto contra el cenicero, la punta se chafa en una
// masa arrugada y quemada que se ensancha, y el cigarro se va acortando. No se dobla.
const CIG = { paper: 80, filter: 26, w: 7 };
function cigGeom(p) {
  const s = scene;
  const X = 58 * p;                                   // papel que se va chafando
  const crLen = 2 + X * 0.2;                          // altura de la masa chafada
  const grind = s.slammed ? Math.sin(s.t * 16) * 0.06 * (0.4 + s.lvS) : 0;
  const ang = -0.98 - 0.32 * p + grind;               // al empujar se pone algo más vertical
  const v = { x: Math.cos(ang), y: Math.sin(ang) };
  const E = { x: EMBER.x, y: EMBER.y };
  const C = { x: E.x + v.x * crLen, y: E.y + v.y * crLen };
  const lenP = CIG.paper - X;
  const F = { x: C.x + v.x * lenP, y: C.y + v.y * lenP };
  const T = { x: F.x + v.x * CIG.filter, y: F.y + v.y * CIG.filter };
  return { E, C, F, top: T, dir: v, ang, X, crLen };
}

// tubo con volumen: degradado perpendicular al eje (luz arriba-izquierda)
function tube(a, b, w, stops) {
  const dx = b.x - a.x, dy = b.y - a.y, m = Math.hypot(dx, dy) || 1, nx = -dy / m, ny = dx / m;
  const h = w / 2;
  const gr = ctx.createLinearGradient(a.x - nx * h, a.y - ny * h, a.x + nx * h, a.y + ny * h);
  stops.forEach(([o, c]) => gr.addColorStop(o, c));
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.moveTo(a.x - nx * h, a.y - ny * h); ctx.lineTo(b.x - nx * h, b.y - ny * h);
  ctx.lineTo(b.x + nx * h, b.y + ny * h); ctx.lineTo(a.x + nx * h, a.y + ny * h);
  ctx.closePath(); ctx.fill();
  return { nx, ny };
}
const PAPER = [[0, "#8f8a82"], [0.18, "#e9e6df"], [0.42, "#ffffff"], [0.75, "#d9d5cc"], [1, "#7d786f"]];
const CORK = [[0, "#6e5638"], [0.2, "#b99a6c"], [0.45, "#e0c495"], [0.8, "#a8875a"], [1, "#5a4429"]];

function drawCigarette() {
  const s = scene, p = s.press;
  const G = cigGeom(p), w = CIG.w;
  const { E, C, F, top, ang } = G;
  const ax = { x: Math.cos(ang), y: Math.sin(ang) }, nr = { x: -ax.y, y: ax.x };
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  // sombra proyectada
  ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(E.x + 4, E.y + 3); ctx.lineTo(F.x + 12, F.y + 14); ctx.stroke();

  // contorno + cuerpo de papel recto
  ctx.strokeStyle = "rgba(10,10,10,.85)"; ctx.lineWidth = w + 2.2;
  ctx.beginPath(); ctx.moveTo(C.x, C.y); ctx.lineTo(top.x, top.y); ctx.stroke();
  tube(C, F, w, PAPER);
  // arrugas que suben por el papel desde la punta a medida que se aprieta
  if (p > 0.04) {
    const n = 2 + Math.round(p * 4), reach = 0.25 + 0.35 * p;
    for (let i = 0; i < n; i++) {
      const t = rrSeed(i * 5.3) * reach, x = C.x + (F.x - C.x) * t, y = C.y + (F.y - C.y) * t, sk = (rrSeed(i * 2.1) - 0.5) * 4;
      ctx.strokeStyle = `rgba(80,75,68,${(0.3 + p * 0.5) * (1 - t / reach * 0.6)})`; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(x - nr.x * w * 0.45 + ax.x * sk, y - nr.y * w * 0.45 + ax.y * sk); ctx.lineTo(x + nr.x * w * 0.45, y + nr.y * w * 0.45); ctx.stroke();
    }
    // papel que se abomba justo encima de la masa chafada
    const bul = Math.min(1, p * 1.4);
    ctx.fillStyle = "#f4f1ea"; ctx.strokeStyle = "rgba(10,10,10,.7)"; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.ellipse(C.x + ax.x * 2, C.y + ax.y * 2, w * 0.5 * (1 + 0.25 * bul), 2.2, ang + Math.PI / 2, 0, 7); ctx.fill(); ctx.stroke();
  }

  // filtro de corcho con motas y anillos
  const fn = tube(F, top, w, CORK);
  ctx.fillStyle = "rgba(70,45,20,.55)";
  for (let i = 0; i < 16; i++) {
    const t = rrSeed(i) * 0.95 + 0.03, o = (rrSeed(i + 9) - 0.5) * w * 0.8;
    ctx.fillRect(F.x + (top.x - F.x) * t + fn.nx * o - 0.5, F.y + (top.y - F.y) * t + fn.ny * o - 0.5, 1, 1);
  }
  const ring = (t, col, lw) => {
    const x = F.x + (top.x - F.x) * t, y = F.y + (top.y - F.y) * t;
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = "butt";
    ctx.beginPath(); ctx.moveTo(x - fn.nx * w / 2, y - fn.ny * w / 2); ctx.lineTo(x + fn.nx * w / 2, y + fn.ny * w / 2); ctx.stroke();
  };
  ring(0.04, RED, 1.6); ring(0.12, "#d8b45a", 0.8);
  ctx.lineCap = "round";
  ctx.fillStyle = "#e9dcc2"; ctx.beginPath(); ctx.ellipse(top.x, top.y, w / 2, w / 4, ang + Math.PI / 2, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 0.6; ctx.stroke();

  // masa chafada: capas de papel aplastadas contra el cenicero, cada vez más anchas y quemadas abajo
  if (p > 0.02) {
    const layers = 2 + Math.round(G.X / 7);
    for (let i = layers; i >= 0; i--) {
      const t = i / layers;                                   // 0 = contra el cenicero, 1 = arriba
      const x = E.x + (C.x - E.x) * t, y = E.y + (C.y - E.y) * t;
      const wid = w * (1 + p * 2.1 * (1 - t * 0.8) + (s.slammed ? 0.5 * (1 - t) : 0)) * (0.85 + rrSeed(i * 3.9) * 0.3);
      const hgt = Math.max(1.4, G.crLen / layers + 1.2) * (0.7 + rrSeed(i * 1.3) * 0.6);
      const off = (rrSeed(i * 7.7) - 0.5) * 3 * p;
      const rot = (rrSeed(i * 7.1) - 0.5) * 0.35;             // casi horizontales: se chafan contra la superficie
      const burn = clamp(1 - t * 1.6, 0, 1) * Math.min(1, p * 1.5);
      const lit = i % 2 ? 255 : 228, mixc = v => Math.round(v * (1 - burn) + 70 * burn);
      const fg = ctx.createLinearGradient(x, y - hgt, x, y + hgt);
      fg.addColorStop(0, `rgb(${mixc(lit)},${mixc(lit - 4)},${mixc(lit - 12)})`);
      fg.addColorStop(1, `rgb(${mixc(150)},${mixc(146)},${mixc(138)})`);
      ctx.fillStyle = fg; ctx.strokeStyle = "rgba(10,10,10,.7)"; ctx.lineWidth = 0.7;
      // contorno irregular de papel arrugado
      ctx.beginPath();
      const pts = 10;
      for (let k = 0; k <= pts; k++) {
        const a = (k / pts) * Math.PI * 2, jag = 0.82 + rrSeed(i * 13 + k * 1.7) * 0.32;
        const px = x + off + Math.cos(a) * wid / 2 * jag, py = y + Math.sin(a) * hgt * jag;
        const qx = px - x, qy = py - y;
        const rx = x + qx * Math.cos(rot) - qy * Math.sin(rot), ry = y + qx * Math.sin(rot) + qy * Math.cos(rot);
        k ? ctx.lineTo(rx, ry) : ctx.moveTo(rx, ry);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // pliegue marcado en cada capa
      ctx.strokeStyle = `rgba(40,36,32,${0.35 + burn * 0.4})`; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.moveTo(x + off - wid * 0.3, y); ctx.lineTo(x + off + wid * 0.1, y - hgt * 0.4); ctx.lineTo(x + off + wid * 0.32, y + hgt * 0.1); ctx.stroke();
    }
  }
  // tabaco que asoma y ceniza mezclada al chafar
  if (p > 0.3) {
    const a = clamp((p - 0.3) / 0.7, 0, 1);
    for (let i = 0; i < 14; i++) {
      const ang2 = rrSeed(i * 1.7) * Math.PI * 2, r = (3 + rrSeed(i * 4.1) * 9) * a;
      ctx.fillStyle = i % 3 ? `rgba(110,78,44,${a})` : `rgba(90,88,84,${a})`;
      ctx.fillRect(E.x + Math.cos(ang2) * r - 1, E.y + 1 + Math.sin(ang2) * r * 0.35 - 0.6, 2.4, 1.2);
    }
  }

  // ceniza en la punta (se rompe al empezar a apretar)
  const e = s.ember;
  if (p < 0.1) {
    const A2 = { x: E.x - ax.x * 7, y: E.y - ax.y * 7 };
    tube(E, A2, w * 0.95, [[0, "#3c3b39"], [0.35, "#8f8c86"], [0.6, "#6f6c67"], [1, "#2c2b29"]]);
    ctx.strokeStyle = "rgba(20,20,20,.7)"; ctx.lineWidth = 0.7;
    for (const t of [0.35, 0.7]) { const x = E.x - ax.x * 7 * t, y = E.y - ax.y * 7 * t; ctx.beginPath(); ctx.moveTo(x - nr.x * 3, y - nr.y * 3); ctx.lineTo(x + nr.x * 2, y + nr.y * 2); ctx.stroke(); }
  }
  // brasa: se apaga al chafarla
  const eg = ctx.createRadialGradient(E.x, E.y, 1, E.x, E.y, 16 + 14 * s.lvS * e);
  eg.addColorStop(0, `rgba(255,${120 + 100 * e},60,${0.9 * e})`); eg.addColorStop(0.35, `rgba(211,18,26,${0.55 * e})`); eg.addColorStop(1, "rgba(211,18,26,0)");
  ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(E.x, E.y, 30, 0, 7); ctx.fill();
  ctx.strokeStyle = e > 0.3 ? `rgb(255,${90 + 130 * e},${40 * e})` : g(45); ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.ellipse(E.x, E.y + 1, w * 0.5 * (1 + p * 1.6), 2.2 * (1 - p * 0.4), 0, 0, 7); ctx.stroke();
  return { top, dir: G.dir };
}

// pseudoaleatorio fijo (para que las motas del filtro no parpadeen)
function rrSeed(i) { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }

function drawHand(top, dir) {
  const s = scene, p = s.press;
  // marco local: origen en el filtro, +y bajando por el cigarro hacia la brasa
  const twist = s.slammed ? Math.sin(s.t * 16) * 0.07 * (0.4 + s.lvS) : Math.sin(s.t * 1.7) * 0.015;
  const th = Math.atan2(dir.x, -dir.y) + twist;
  const cs = Math.cos(th), sn = Math.sin(th);
  const W = (x, y) => ({ x: top.x + x * cs - y * sn, y: top.y + x * sn + y * cs });

  // ---------------- antebrazo tatuado
  const GRIP = 10;                                  // el pellizco agarra el filtro un poco por debajo de su extremo
  const wrist = W(7, -56 + GRIP);
  const ad = (() => { const lx = 0.40, ly = -0.92, m = Math.hypot(lx, ly); return { x: (lx * cs - ly * sn) / m, y: (lx * sn + ly * cs) / m }; })();
  const elbow = { x: wrist.x + ad.x * 260, y: wrist.y + ad.y * 260 };
  const n = { x: -ad.y, y: ad.x };
  const w0 = 16, w1 = 27;
  const arm = new Path2D();
  arm.moveTo(wrist.x + n.x * w0, wrist.y + n.y * w0);
  arm.quadraticCurveTo(wrist.x + ad.x * 60 + n.x * (w0 + 6), wrist.y + ad.y * 60 + n.y * (w0 + 6), elbow.x + n.x * w1, elbow.y + n.y * w1);
  arm.lineTo(elbow.x - n.x * w1, elbow.y - n.y * w1);
  arm.quadraticCurveTo(wrist.x + ad.x * 60 - n.x * (w0 + 4), wrist.y + ad.y * 60 - n.y * (w0 + 4), wrist.x - n.x * w0, wrist.y - n.y * w0);
  arm.closePath();
  ctx.save(); ctx.translate(6, 8); ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fill(arm); ctx.restore();
  let gr = ctx.createLinearGradient(wrist.x - n.x * 22, wrist.y - n.y * 22, wrist.x + n.x * 22, wrist.y + n.y * 22);
  gr.addColorStop(0, "#8f887d"); gr.addColorStop(0.45, "#ddd6cb"); gr.addColorStop(1, "#6f685e");
  ctx.fillStyle = gr; ctx.fill(arm);
  // irezumi: olas seigaiha y flores rojas
  ctx.save(); ctx.clip(arm);
  ctx.translate(wrist.x, wrist.y); ctx.rotate(Math.atan2(ad.y, ad.x) + Math.PI / 2);
  ctx.strokeStyle = "rgba(12,12,12,.9)"; ctx.lineWidth = 1.3;
  for (let row = 0; row < 20; row++) for (let col = -3; col <= 3; col++) {
    const x = col * 13 + (row % 2) * 6.5, y = -row * 8.5 - 26;
    for (const r of [6.5, 4.2, 2]) { ctx.beginPath(); ctx.arc(x, y, r, Math.PI, 0); ctx.stroke(); }
  }
  for (const [x, y, r] of [[-7, -70, 7], [9, -120, 8], [-5, -175, 7.5], [7, -220, 6]]) {
    ctx.fillStyle = "rgba(211,18,26,.95)";
    for (let k = 0; k < 5; k++) { const a = k * 1.2566; ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6, r * 0.55, r * 0.36, a, 0, 7); ctx.fill(); }
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(x, y, r * 0.25, 0, 7); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(10,10,10,.9)"; ctx.lineWidth = 1.4; ctx.stroke(arm);
  // manga de traje negra + puño de camisa
  const c0 = { x: wrist.x + ad.x * 150, y: wrist.y + ad.y * 150 };
  const sleeve = new Path2D(), sw = 30;
  sleeve.moveTo(c0.x + n.x * sw, c0.y + n.y * sw);
  sleeve.lineTo(c0.x + ad.x * 200 + n.x * (sw + 8), c0.y + ad.y * 200 + n.y * (sw + 8));
  sleeve.lineTo(c0.x + ad.x * 200 - n.x * (sw + 8), c0.y + ad.y * 200 - n.y * (sw + 8));
  sleeve.lineTo(c0.x - n.x * sw, c0.y - n.y * sw);
  sleeve.closePath();
  ctx.fillStyle = "#ece8e1"; ctx.save(); ctx.translate(-ad.x * 7, -ad.y * 7); ctx.fill(sleeve); ctx.restore();
  ctx.fillStyle = g(14); ctx.fill(sleeve);
  ctx.strokeStyle = g(80); ctx.lineWidth = 1; ctx.stroke(sleeve);

  // ---------------- mano (marco local)
  ctx.save();
  ctx.translate(top.x, top.y); ctx.rotate(th); ctx.translate(0, GRIP);
  const SK_L = "#ebe4d9", SK_M = "#cbc3b6", SK_D = "#968e81", OUT = "#121212";
  const lerp = (a, b, t) => a + (b - a) * t;
  // dedo con volumen: cadena de cápsulas con radio por articulación
  // cada pieza se rellena por separado para que los sentidos de giro no abran agujeros
  const fillLimb = (pts, grow) => {
    for (let k = 0; k < pts.length - 1; k++) {
      const [x0, y0, r0] = pts[k], [x1, y1, r1] = pts[k + 1];
      const dx = x1 - x0, dy = y1 - y0, m = Math.hypot(dx, dy) || 1, nx = -dy / m, ny = dx / m;
      ctx.beginPath();
      ctx.moveTo(x0 + nx * (r0 + grow), y0 + ny * (r0 + grow)); ctx.lineTo(x1 + nx * (r1 + grow), y1 + ny * (r1 + grow));
      ctx.lineTo(x1 - nx * (r1 + grow), y1 - ny * (r1 + grow)); ctx.lineTo(x0 - nx * (r0 + grow), y0 - ny * (r0 + grow)); ctx.closePath();
      ctx.fill();
    }
    for (const [x, y, r] of pts) { ctx.beginPath(); ctx.arc(x, y, r + grow, 0, Math.PI * 2); ctx.fill(); }
  };
  const finger = (pts, base, o = {}) => {
    ctx.fillStyle = OUT; fillLimb(pts, 1.3);
    const a = pts[0], z = pts[pts.length - 1];
    const dx = z[0] - a[0], dy = z[1] - a[1], m = Math.hypot(dx, dy) || 1, nx = -dy / m, ny = dx / m;
    const mx = (a[0] + z[0]) / 2, my = (a[1] + z[1]) / 2, R = Math.max(...pts.map(q => q[2])) * 1.1;
    const lightSide = nx * -1 + ny * -1 > 0 ? 1 : -1;               // la luz viene de arriba a la izquierda
    const gr = ctx.createLinearGradient(mx + nx * R * lightSide, my + ny * R * lightSide, mx - nx * R * lightSide, my - ny * R * lightSide);
    gr.addColorStop(0, SK_L); gr.addColorStop(0.5, base); gr.addColorStop(1, SK_D);
    ctx.fillStyle = gr; fillLimb(pts, 0);
    // brillo a lo largo del dedo
    ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineCap = "round";
    for (let k = 0; k < pts.length - 1; k++) {
      const [x0, y0, r0] = pts[k], [x1, y1, r1] = pts[k + 1];
      const ddx = x1 - x0, ddy = y1 - y0, mm = Math.hypot(ddx, ddy) || 1, qx = -ddy / mm * lightSide, qy = ddx / mm * lightSide;
      ctx.lineWidth = Math.min(r0, r1) * 0.45;
      ctx.beginPath(); ctx.moveTo(x0 + qx * r0 * 0.5 + ddx / mm * r0 * 0.4, y0 + qy * r0 * 0.5 + ddy / mm * r0 * 0.4); ctx.lineTo(x1 + qx * r1 * 0.5 - ddx / mm * r1 * 0.4, y1 + qy * r1 * 0.5 - ddy / mm * r1 * 0.4); ctx.stroke();
    }
    // arrugas de los nudillos
    ctx.strokeStyle = "rgba(40,30,25,.55)"; ctx.lineWidth = 0.8;
    for (let k = 1; k < pts.length - 1; k++) {
      const [x, y, r] = pts[k];
      for (const off of [-0.6, 0.6]) { ctx.beginPath(); ctx.arc(x + off, y + off * 0.3, r * 0.7, Math.PI * 1.05, Math.PI * 1.45); ctx.stroke(); }
    }
    // anillo de oro
    if (o.ring) {
      const [x0, y0, r0] = pts[0], [x1, y1] = pts[1], t = 0.55;
      const cx = x0 + (x1 - x0) * t, cy = y0 + (y1 - y0) * t, ang = Math.atan2(y1 - y0, x1 - x0);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
      const rg = ctx.createLinearGradient(0, -r0, 0, r0); rg.addColorStop(0, "#fff6c2"); rg.addColorStop(0.4, "#e0b23c"); rg.addColorStop(1, "#6e4c0c");
      ctx.fillStyle = OUT; ctx.fillRect(-2.2, -r0 - 1.2, 4.4, r0 * 2 + 2.4);
      ctx.fillStyle = rg; ctx.fillRect(-1.5, -r0 - 0.6, 3, r0 * 2 + 1.2);
      ctx.restore();
    }
    // uña
    if (o.nail) {
      const [x0, y0] = pts[pts.length - 2], [x1, y1, r1] = pts[pts.length - 1];
      const ang = Math.atan2(y1 - y0, x1 - x0);
      ctx.save(); ctx.translate(x1, y1); ctx.rotate(ang); ctx.translate(-r1 * 0.35, o.nail * r1 * 0.22);
      const ng = ctx.createLinearGradient(0, -r1, 0, r1); ng.addColorStop(0, "#fffaf2"); ng.addColorStop(1, "#cfc5b6");
      ctx.fillStyle = ng; ctx.beginPath(); ctx.roundRect(-r1 * 0.75, -r1 * 0.62, r1 * 1.45, r1 * 1.24, [r1 * 0.3, r1 * 0.62, r1 * 0.62, r1 * 0.3]); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = 0.7; ctx.stroke();
      ctx.strokeStyle = "rgba(120,90,80,.6)"; ctx.beginPath(); ctx.arc(-r1 * 0.75, 0, r1 * 0.5, -1.1, 1.1); ctx.stroke();   // cutícula
      ctx.restore();
    }
  };

  const bend = clamp(p, 0, 1);
  // dedos de atrás (doblados): anular y muñón del meñique (yubitsume)
  finger([[19, -22, 4.4], [26, -11, 4.0], [21, -3, 3.5]], SK_D);
  finger([[16, -17, 3.9], [22, -12, 3.5]], SK_D);
  ctx.fillStyle = "#7a3b3b"; ctx.beginPath(); ctx.ellipse(23, -11.5, 2.4, 2.0, 0.6, 0, 7); ctx.fill();   // cicatriz del corte
  // corazón: apoya al lado del filtro
  finger([[15, -28, 4.9], [23, -14 + bend, 4.4], [10, 3, 3.8]], SK_M, { nail: 1, ring: true });

  // dorso de la mano
  const palm = new Path2D();
  palm.moveTo(-9, -63);
  palm.quadraticCurveTo(6, -68, 22, -62);
  palm.quadraticCurveTo(30, -46, 27, -30);
  palm.quadraticCurveTo(26, -22, 20, -21);
  palm.quadraticCurveTo(14, -25, 8, -28);
  palm.quadraticCurveTo(0, -30, -6, -32);
  palm.quadraticCurveTo(-14, -42, -9, -63);
  palm.closePath();
  gr = ctx.createLinearGradient(-12, -64, 26, -24);
  gr.addColorStop(0, SK_L); gr.addColorStop(0.6, SK_M); gr.addColorStop(1, SK_D);
  ctx.fillStyle = gr; ctx.fill(palm);
  // tatuaje que sigue en el dorso (olas rojas finas)
  ctx.save(); ctx.clip(palm);
  ctx.strokeStyle = "rgba(15,15,15,.75)"; ctx.lineWidth = 1.1;
  for (let row = 0; row < 3; row++) for (let col = -2; col <= 3; col++) {
    const x = col * 11 + (row % 2) * 5.5, y = -60 + row * 7;
    for (const r of [5.5, 3.4]) { ctx.beginPath(); ctx.arc(x, y, r, Math.PI, 0); ctx.stroke(); }
  }
  ctx.restore();
  // tendones y nudillos
  ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = 1;
  for (const [kx, ky, wx] of [[9, -29, 2], [16, -27, 9], [21, -23, 15]]) { ctx.beginPath(); ctx.moveTo(kx, ky - 2); ctx.quadraticCurveTo((kx + wx) / 2 + 1, -42, wx, -54); ctx.stroke(); }
  ctx.fillStyle = "rgba(255,255,255,.5)";
  for (const [kx, ky] of [[8, -30], [15, -28.5], [21, -24.5]]) { ctx.beginPath(); ctx.ellipse(kx, ky, 3, 1.8, -0.3, 0, 7); ctx.fill(); }
  ctx.strokeStyle = OUT; ctx.lineWidth = 1.4; ctx.stroke(palm);

  // índice: presiona encima del filtro; se dobla más al apretar
  finger([[8, -29, 5.1], [lerp(14, 17, bend), lerp(-15, -12, bend), 4.6], [5.5, 1.5, 4.0]], SK_L, { nail: 1 });
  // pulgar: pinza por el otro lado, con la eminencia tenar
  ctx.fillStyle = OUT; ctx.beginPath(); ctx.ellipse(-8, -48, 9.5, 12.5, 0.3, 0, 7); ctx.fill();
  { const tg = ctx.createRadialGradient(-11, -52, 1, -8, -48, 12); tg.addColorStop(0, SK_L); tg.addColorStop(1, SK_M); ctx.fillStyle = tg; ctx.beginPath(); ctx.ellipse(-8, -48, 8.3, 11.3, 0.3, 0, 7); ctx.fill(); }
  finger([[-8, -44, 6.0], [-13, -24, 5.2], [-6, 2, 4.3]], SK_M, { nail: -1 });

  ctx.restore();
}

function drawParticles() {
  const s = scene;
  // hebras de tabaco
  for (const q of s.tobacco) {
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
    ctx.fillStyle = `rgba(120,86,50,${Math.min(1, q.life * 2)})`; ctx.fillRect(-q.len / 2, -0.8, q.len, 1.6);
    ctx.restore();
  }
  for (const p of s.puffs) { ctx.fillStyle = g(215, p.a * 0.5); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  for (const p of s.ash) { ctx.fillStyle = g(150, Math.min(1, p.life)); ctx.fillRect(p.x - p.r, p.y - p.r * 0.6, p.r * 2, p.r * 1.2); }
  for (const p of s.sparks) {
    const a = Math.min(1, p.life / 0.5);
    ctx.strokeStyle = `rgba(255,${150 + 80 * a},90,${a})`; ctx.lineWidth = p.r;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02); ctx.stroke();
  }
}
function drawPetals() {
  for (const p of scene.petals) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = `rgba(230,120,130,${0.75 * p.life})`;
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.quadraticCurveTo(4, -1, 0, 4); ctx.quadraticCurveTo(-4, -1, 0, -4); ctx.fill();
    ctx.restore();
  }
}

function seeded(seed) { let x = seed; return () => { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; }; }
function drawSplats() {
  for (const sp of scene.splats) {
    const R = seeded(Math.floor(sp.seed) + 1);
    const a = clamp(sp.a, 0, 1);
    // salpicadura de tinta roja tipo pincel (sumi-e)
    ctx.fillStyle = `rgba(122,3,9,${a * 0.9})`;
    const path = new Path2D();
    const n = 11, pts = [];
    for (let i = 0; i < n; i++) { const ang = (i / n) * Math.PI * 2, d = sp.r * (0.8 + R() * 0.45); pts.push([sp.x + Math.cos(ang) * d, sp.y + Math.sin(ang) * d]); }
    path.moveTo((pts[0][0] + pts[n - 1][0]) / 2, (pts[0][1] + pts[n - 1][1]) / 2);
    for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; path.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    path.closePath();
    ctx.save(); ctx.translate(1, 1.5); ctx.fill(path); ctx.restore();
    ctx.fillStyle = `rgba(211,18,26,${a})`; ctx.fill(path);
    for (let i = 0; i < 8; i++) { const ang = R() * 6.28, d = sp.r * (1.6 + R() * 1.4), r = 0.8 + R() * 2.6; ctx.beginPath(); ctx.arc(sp.x + Math.cos(ang) * d, sp.y + Math.sin(ang) * d, r, 0, 7); ctx.fill(); }
    for (let i = 0; i < 2; i++) { const dx = (R() - 0.5) * sp.r, len = sp.drip * (0.5 + R() * 0.5), w = 2 + R() * 2; ctx.fillRect(sp.x + dx - w / 2, sp.y, w, sp.r * 0.6 + len); ctx.beginPath(); ctx.arc(sp.x + dx, sp.y + sp.r * 0.6 + len, w * 0.75, 0, 7); ctx.fill(); }
  }
}

function drawOverlay() {
  const s = scene;
  const vg = ctx.createRadialGradient(SW / 2, SH * 0.45, 80, SW / 2, SH * 0.45, 300);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, SW, SH);
  if (s.shake > 0) { ctx.fillStyle = `rgba(255,255,255,${0.35 * s.shake * s.shake})`; ctx.fillRect(0, 0, SW, SH); }   // destello al golpear
}

function drawScene() {
  const s = scene;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, SW, SH); ctx.clip();
  if (s.shake > 0) ctx.translate(rr(-1, 1) * s.shake * 4, rr(-1, 1) * s.shake * 4);
  drawBackground();
  ctx.save();
  ctx.translate(FG.x, FG.y + FG.dy); ctx.scale(FG.k, FG.k); ctx.translate(-FG.x, -FG.y);
  drawTable();
  drawProps();
  drawAshtray(false);
  const cig = drawCigarette();
  drawAshtray(true);
  drawHand(cig.top, cig.dir);
  drawParticles();
  ctx.restore();
  drawPetals();
  drawOverlay();
  drawSplats();
  ctx.restore();
}

// ---------------------------------------------------------------- pantalla LCD
const low = document.createElement("canvas"); low.width = LW; low.height = LH;
const lowCtx = low.getContext("2d", { willReadFrequently: true });
const ghost = document.createElement("canvas"); ghost.width = LW; ghost.height = LH;
const ghostCtx = ghost.getContext("2d");
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);

function lcdText(t, x, y, align = "left", size = 8) {
  ctx.font = `${size}px NPix, monospace`; ctx.textAlign = align; ctx.textBaseline = "top";
  ctx.fillText(t, x, y);
}

// texto y medidor de la pantalla, sin antialias: se umbraliza a píxel puro
const hud = document.createElement("canvas"); hud.width = LW; hud.height = LH;
const hudCtx = hud.getContext("2d", { willReadFrequently: true });
function drawHUD(pal) {
  const h = hudCtx, sc = scene;
  h.clearRect(0, 0, LW, LH);
  h.font = "8px NPix"; h.textBaseline = "top";
  // relleno = verde (claro), contorno = rojo (oscuro)
  const fill = (t, x, y, al = "left") => { h.textAlign = al; h.fillStyle = "#0f0"; h.fillText(t, x, y); };
  const hint = hover && hover !== "mode" ? HINTS[hover] : (hover === "mode" ? "MODO: " + MODES[modeIdx].hint : null);
  if (hint) fill(hint, 1, 1);
  else {
    fill("\u25C0" + MODES[modeIdx].name + "\u25B6", 1, 1);
    if (sc.combo > 1) fill("COMBO x" + sc.combo, LW - 1, 1, "right");
    else fill("PTS" + String(sc.score).padStart(6, "0"), LW - 1, 1, "right");
  }
  fill("OUT", 1, 152);
  // ¡潰! gigante al aplastar
  if (sc.impactT > 0) {
    const t = 1 - sc.impactT, bounce = Math.round(Math.max(0, 1 - t * 4) * -18 + Math.sin(t * 30) * Math.max(0, 0.5 - t) * 4);
    h.font = "32px NDot"; h.textAlign = "center"; h.textBaseline = "middle";
    h.lineWidth = 6; h.strokeStyle = "#f00"; h.lineJoin = "round";
    const y = 72 + bounce;
    h.strokeText("潰!", LW / 2, y); h.fillStyle = "#0f0"; h.fillText("潰!", LW / 2, y);
    if (t > 0.15) { h.font = "8px NPix"; h.lineWidth = 4; h.strokeText("CRUSHED", LW / 2, y + 24); h.fillText("CRUSHED", LW / 2, y + 24); }
  } else if (sc.slammed && sc.combo > 2 && sc.comboT > 1.6) {
    h.font = "16px NDot"; h.textAlign = "center"; h.textBaseline = "middle"; h.lineWidth = 4; h.strokeStyle = "#f00";
    h.strokeText(sc.combo + "連", 150, 30); h.fillStyle = "#0f0"; h.fillText(sc.combo + "連", 150, 30);
  }
  const id = h.getImageData(0, 0, LW, LH).data;
  const out = lowCtx.getImageData(0, 0, LW, LH), d = out.data, light = pal[3], dark = pal[0];
  for (let i = 0; i < id.length; i += 4) {
    if (id[i + 3] < 110) continue;
    const c = id[i + 1] > 128 ? light : (id[i] > 128 ? dark : null);
    if (c) { d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; }
  }
  lowCtx.putImageData(out, 0, 0);
  // bloques del medidor
  const db = v => 20 * Math.log10(Math.max(v, 1e-3));
  const lvl = clamp((db(meter.out) + 48) / 48, 0, 1), pk = clamp((db(meter.peak) + 48) / 48, 0, 1);
  const segs = 20, lit = Math.round(lvl * segs), pkSeg = Math.round(pk * segs) - 1;
  const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  for (let i = 0; i < segs; i++) {
    const on = i < lit || i === pkSeg, hot = i >= segs - 5, x = 28 + Math.round(i * 7.75);
    lowCtx.fillStyle = css(on ? pal[3] : pal[1]); lowCtx.fillRect(x, 153, 6, 6);
    if (hot) { lowCtx.fillStyle = css(on ? pal[1] : pal[0]); lowCtx.fillRect(x + 2, 155, 2, 2); }
  }
}

function renderBoot() {
  // pantalla de arranque: el logo baja desde arriba
  const c2 = lowCtx, t = bootT;
  c2.setTransform(1, 0, 0, 1, 0, 0);
  c2.fillStyle = "#fff"; c2.fillRect(0, 0, LW, LH);
  c2.fillStyle = "#000"; c2.textAlign = "center"; c2.textBaseline = "top";
  const y = Math.round(-20 + 78 * Math.min(1, t / 1.25));
  c2.font = "16px NPix"; c2.fillText("NICOTINA", LW / 2, y);
  if (t > 1.35) { c2.font = "16px NDot"; c2.fillText("ニコチン", LW / 2, y + 24); }
  if (t > 1.7) { c2.font = "8px NPix"; c2.fillText("NA1MDIAZ", LW / 2, y + 50); }
  if (t > 1.25 && t < 1.45) { c2.fillStyle = "#000"; c2.fillRect(LW / 2 - 70, y + 20, 140, 1); }
  const img = c2.getImageData(0, 0, LW, LH), d = img.data, pal = PALETTES[palIdx].c.map(hex);
  for (let i = 0; i < d.length; i += 4) {
    const L = d[i] / 255, c = pal[L > 0.75 ? 3 : L > 0.45 ? 2 : L > 0.2 ? 1 : 0];
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  c2.putImageData(img, 0, 0);
  ghostCtx.globalAlpha = 0.72; ghostCtx.drawImage(low, 0, 0); ghostCtx.globalAlpha = 1;
}

function renderLCD() {
  if (!powerOn) return;                 // pantalla apagada: no se dibuja nada (ahorra CPU)
  if (bootT < BOOT_LEN) { renderBoot(); return; }
  const mainCtx = ctx;
  ctx = lowCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, LW, LH);

  // escena (zona 10..152)
  const k = LW / SW;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 10, LW, 142); ctx.clip();
  ctx.translate(0, 10); ctx.scale(k, k); ctx.translate(0, -4);
  drawScene();
  ctx.restore();

  // marcos de la barra de estado y del medidor (el texto va después, nítido)
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, LW, 10); ctx.fillRect(0, 151, LW, 9);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 10, LW, 1); ctx.fillRect(0, 151, LW, 1);

  // cuantizar a 4 tonos con tramado Bayer (como una LCD de 4 grises)
  const img = ctx.getImageData(0, 0, LW, LH), d = img.data;
  const src = new Uint8ClampedArray(d);
  let pal = PALETTES[palIdx].c.map(hex);
  if (scene.flashT > 0) pal = pal.slice().reverse();          // fotograma de impacto: paleta invertida
  // lo que le pasa al audio le pasa a la pantalla: menos bits = menos tonos, menos sample rate = píxeles más gordos
  const cc = params.crush.v / 100;
  const effBits = 16 - (16 - params.bits.v) * cc;
  const tones = effBits >= 7 ? 4 : effBits >= 4 ? 3 : 2;
  const toneMap = tones === 4 ? [0, 1, 2, 3] : tones === 3 ? [0, 2, 3] : [0, 3];
  const blk = 1 + Math.round(cc * clamp((params.rate.v - 1) / 24, 0, 1) * 3) + (modeIdx === 3 && scene.slammed ? 1 : 0);
  // glitch: franjas desplazadas en los golpes
  const shift = new Int16Array(LH);
  if (scene.glitchT > 0) {
    const bands = 2 + (Math.random() * 4 | 0);
    for (let b = 0; b < bands; b++) { const y0 = 11 + (Math.random() * 136 | 0), h = 2 + (Math.random() * 10 | 0), o = ((Math.random() - 0.5) * 26 * (0.4 + scene.glitchT * 2)) | 0; for (let y = y0; y < Math.min(150, y0 + h); y++) shift[y] = o; }
  }
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
    const i = (y * LW + x) * 4;
    let sx = x, sy = y;
    if (y > 10 && y < 151) {
      sx = clamp(x - shift[y], 0, LW - 1);
      if (blk > 1) { sx -= sx % blk; sy = 11 + (((y - 11) / blk) | 0) * blk; }
    }
    const j = (sy * LW + sx) * 4;
    let L = (0.3 * src[j] + 0.59 * src[j + 1] + 0.11 * src[j + 2]) / 255;
    // el rojo se lee como tono claro-medio para que la sangre/tinta destaque
    const redness = Math.max(0, src[j] - Math.max(src[j + 1], src[j + 2])) / 255;
    L = Math.max(L, redness * 0.62);
    L = Math.pow(clamp((L - 0.04) / 0.7, 0, 1), 0.8);     // levantar sombras: la escena es oscura
    const bx = blk > 1 ? sx / blk | 0 : x, by = blk > 1 ? sy / blk | 0 : y;
    const tl = (y > 10 && y < 151) ? toneMap.length - 1 : 3;
    const lvlv = clamp(Math.floor(L * tl + 0.5 + (BAYER[(by & 3) * 4 + (bx & 3)] - 0.5) * 0.62), 0, tl);
    const c = pal[(y > 10 && y < 151) ? toneMap[lvlv] : lvlv];
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  drawHUD(pal);

  // persistencia de la LCD (estela)
  ghostCtx.globalAlpha = 0.72;
  ghostCtx.drawImage(low, 0, 0);
  ghostCtx.globalAlpha = 1;
  ctx = mainCtx;
}

function drawScreen() {
  const pal = PALETTES[palIdx].c;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (!powerOn) {
    const off = hex(pal[1]).map((v, i) => Math.round(v * 0.35 + [96, 104, 88][i] * 0.65));
    ctx.fillStyle = `rgb(${off.join(",")})`; ctx.fillRect(SCR.x, SCR.y, SCR.w, SCR.h);
  } else {
    ctx.drawImage(ghost, SCR.x, SCR.y, SCR.w, SCR.h);
    // los píxeles oscuros proyectan una sombra sobre el fondo (como en la LCD real)
    ctx.globalCompositeOperation = "multiply"; ctx.globalAlpha = 0.3;
    ctx.drawImage(ghost, SCR.x + 1, SCR.y + 1.2, SCR.w, SCR.h);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  }
  // rejilla de píxeles
  ctx.fillStyle = pal[0]; ctx.globalAlpha = 0.16;
  for (let x = 0; x <= LW; x++) ctx.fillRect(SCR.x + x * 2 - 0.2, SCR.y, 0.4, SCR.h);
  for (let y = 0; y <= LH; y++) ctx.fillRect(SCR.x, SCR.y + y * 2 - 0.2, SCR.w, 0.4);
  ctx.globalAlpha = 1;
  // sombra interior + reflejo del cristal
  let gr = ctx.createLinearGradient(0, SCR.y, 0, SCR.y + 18);
  gr.addColorStop(0, "rgba(0,0,0,.45)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = gr; ctx.fillRect(SCR.x, SCR.y, SCR.w, 18);
  gr = ctx.createLinearGradient(SCR.x, 0, SCR.x + 14, 0);
  gr.addColorStop(0, "rgba(0,0,0,.35)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = gr; ctx.fillRect(SCR.x, SCR.y, 14, SCR.h);
  gr = ctx.createLinearGradient(SCR.x, SCR.y, SCR.x + SCR.w, SCR.y + SCR.h);
  gr.addColorStop(0, "rgba(255,255,255,.10)"); gr.addColorStop(0.35, "rgba(255,255,255,.03)"); gr.addColorStop(0.36, "rgba(255,255,255,0)");
  ctx.fillStyle = gr; ctx.fillRect(SCR.x, SCR.y, SCR.w, SCR.h);
  ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.lineWidth = 1.5; ctx.strokeRect(SCR.x - 0.75, SCR.y - 0.75, SCR.w + 1.5, SCR.h + 1.5);
  ctx.restore();
}

// ---------------------------------------------------------------- chasis
let shellTex = null;
function rrectOn(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function inkText(c, t, x, y, size, align = "center", color = INK, font = "NSilk", weight = 700, skew = -0.22) {

  c.fillText(t, 0, 0); c.restore();
}

function makeShell() {
  const k = 2;                                   // la textura se pinta a doble resolución
  const cv = document.createElement("canvas"); cv.width = BW * k; cv.height = BH * k;
  const c = cv.getContext("2d"); c.scale(k, k);
  c.translate(0, OY);

  // cuerpo de la consola: esquina inferior derecha muy redondeada
  const body = new Path2D();
  body.roundRect(6, 6, BW - 12, BH - OY - 12, [18, 18, 92, 18]);
  c.save(); c.translate(0, 6); c.fillStyle = "rgba(0,0,0,.6)"; c.fill(body); c.restore();
  let gr = c.createLinearGradient(0, 0, BW, BH);
  gr.addColorStop(0, "#3a3a3f"); gr.addColorStop(0.5, "#2a2a2e"); gr.addColorStop(1, "#1d1d20");
  c.fillStyle = gr; c.fill(body);
  // textura de plástico
  c.save(); c.clip(body);
  for (let i = 0; i < 60000; i++) { c.fillStyle = Math.random() < 0.5 ? "rgba(255,255,255,.028)" : "rgba(0,0,0,.05)"; c.fillRect(Math.random() * BW, Math.random() * (BH - OY), 0.6, 0.6); }
  // brillo del borde superior
  gr = c.createLinearGradient(0, 6, 0, 40); gr.addColorStop(0, "rgba(255,255,255,.10)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = gr; c.fillRect(0, 6, BW, 34);
  c.restore();
  c.strokeStyle = "rgba(255,255,255,.12)"; c.lineWidth = 1; c.stroke(body);
  c.strokeStyle = "rgba(0,0,0,.8)"; c.lineWidth = 1.5;
  c.save(); c.translate(0.5, 0.5); c.stroke(body); c.restore();

  // ranura superior con el interruptor
  c.fillStyle = "rgba(0,0,0,.45)"; c.fillRect(20, 26, BW - 40, 1.2);

// ---------------------------------------------------------------- mandos
function lcdChip(cx, cy, w, text, hot) {
  const pal = PALETTES[palIdx].c;
  const x = Math.round(cx - w / 2), y = Math.round(cy - 8);
  ctx.fillStyle = "rgba(0,0,0,.55)"; rrect(x - 2, y - 2, w + 4, 20, 3); ctx.fill();
  ctx.fillStyle = hot ? pal[2] : pal[3]; ctx.fillRect(x, y, w, 16);
  ctx.fillStyle = pal[0]; ctx.globalAlpha = 0.12;
  for (let i = 0; i < w; i += 2) ctx.fillRect(x + i, y, 0.5, 16);
  ctx.globalAlpha = 1;
  ctx.fillStyle = pal[0];
  ctx.font = "8px NPix, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, cx, cy + 1);
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawBigKnob(k) {
  const p = params[k.id], pos = toNorm(p, p.v);
  const { cx, cy, r } = k;
  const angle = A0 + pos * (A1 - A0);
  // anillo de 24 LEDs cuadrados
  const n = 24, lit = Math.round(pos * n);
  for (let i = 0; i < n; i++) {
    const a = A0 + (i / (n - 1)) * (A1 - A0);
    const x = cx + Math.sin(a) * (r + 17), y = cy - Math.cos(a) * (r + 17);
    const on = i < lit, hot = i >= n - 3;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    if (on) { ctx.fillStyle = hot ? "rgba(255,60,60,.35)" : "rgba(255,40,40,.22)"; ctx.fillRect(-5, -5, 10, 10); }
    ctx.fillStyle = on ? (hot ? "#ff4a3a" : RED) : "#3a1013";
    ctx.fillRect(-2.8, -2.8, 5.6, 5.6);
    ctx.fillStyle = on ? "rgba(255,255,255,.5)" : "rgba(255,255,255,.06)"; ctx.fillRect(-2.8, -2.8, 5.6, 1.2);
    ctx.restore();
  }
  // cuerpo moleteado
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.beginPath(); ctx.arc(cx, cy + 5, r + 1, 0, 7); ctx.fill();
  let gr = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
  gr.addColorStop(0, "#55565e"); gr.addColorStop(1, "#141417");
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2;
    ctx.fillStyle = i % 2 ? "rgba(0,0,0,.55)" : "rgba(255,255,255,.07)";
    ctx.save(); ctx.rotate(a); ctx.fillRect(-1.6, -r, 3.2, 8); ctx.restore();
  }
  ctx.restore();
  // cara superior cóncava
  gr = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.35, 4, cx, cy, r * 0.8);
  gr.addColorStop(0, "#2c2d33"); gr.addColorStop(1, "#1a1a1e");
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, r - 10, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.10)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, r - 10, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.beginPath(); ctx.arc(cx, cy, r - 10, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
  // grabado
  ctx.fillStyle = "rgba(211,18,26,.22)"; ctx.font = "34px NDot"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("潰", cx, cy + 2);
  // indicador pixelado
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
  ctx.fillStyle = "rgba(255,40,40,.35)"; ctx.fillRect(-4, -r + 4, 8, 22);
  ctx.fillStyle = RED; for (let i = 0; i < 4; i++) ctx.fillRect(-2, -r + 6 + i * 5, 4, 4);
  ctx.restore();
  lcdChip(cx - 2, cy + 128, 96, p.fmt(p.v), p.v >= 90);
}

function drawSmallKnob(k) {
  const p = params[k.id], pos = toNorm(p, p.v);
  const { cx, cy, r } = k;
  const angle = A0 + pos * (A1 - A0);
  // puntos de escala pixelados
  const n = 11;
  for (let i = 0; i < n; i++) {
    const a = A0 + (i / (n - 1)) * (A1 - A0), on = i / (n - 1) <= pos + 1e-4;
    const x = cx + Math.sin(a) * (r + 11), y = cy - Math.cos(a) * (r + 11);
    ctx.fillStyle = on ? BONE : "#3c3d44";
    ctx.fillRect(Math.round(x) - 1.5, Math.round(y) - 1.5, 3, 3);
  }
  // botón granate convexo
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.beginPath(); ctx.arc(cx, cy + 4, r, 0, 7); ctx.fill();
  let gr = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.45, 2, cx, cy, r * 1.05);
  gr.addColorStop(0, "#d0405f"); gr.addColorStop(0.55, "#9b1b39"); gr.addColorStop(1, "#4d0b1b");
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.beginPath(); ctx.ellipse(cx - r * 0.3, cy - r * 0.48, r * 0.38, r * 0.18, -0.4, 0, 7); ctx.fill();
  // marca
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
  ctx.fillStyle = BONE; ctx.fillRect(-1.6, -r + 4, 3.2, 9);
  ctx.restore();
  lcdChip(cx - 6, cy + 56, 74, p.fmt(p.v), false);
}

function drawPill(p) {
  const pressed = p.id === "start" ? bypass : (pillFlash.select > 0);
  ctx.save(); ctx.translate(p.cx, p.cy + (pressed ? 1 : 0)); ctx.rotate(-0.45);

  ctx.fillStyle = gr; rrect(-19, -5, 38, 10, 5); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.25)"; rrect(-15, -4, 30, 2, 1); ctx.fill();

}
const pillFlash = { select: 0 };

function drawPowerSwitch() {

function drawLive() {

  ctx.fillStyle = live ? `rgb(${180 + 75 * a},${30 + 40 * a},${30 + 30 * a})` : "#3a1013";

  ctx.font = "6px NPix"; ctx.fillStyle = "#8a8da0"; ctx.textAlign = "right"; ctx.textBaseline = "middle";

function drawPanel() {
  drawCart();

// ---------------------------------------------------------------- bucle
const cvs = document.getElementById("c");
let ctx = cvs.getContext("2d");
let scale = 1;
function fit() {
  const maxH = window.innerHeight - 90, maxW = window.innerWidth - 24;
  scale = Math.min(maxH / BH, maxW / BW, 1.5);
  const dpr = window.devicePixelRatio || 1;
  cvs.style.width = BW * scale + "px"; cvs.style.height = BH * scale + "px";
  cvs.width = Math.round(BW * scale * dpr); cvs.height = Math.round(BH * scale * dpr);
}
window.addEventListener("resize", fit);

let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  meter.peak = Math.max(meter.out, meter.peak - dt * 0.4);
  if (!playing) meter.out *= 0.9;
  pillFlash.select = Math.max(0, pillFlash.select - dt);
  cartFlash = Math.max(0, cartFlash - dt);
  cartAnim = Math.max(0, cartAnim - dt * 3);
  if (powerOn && bootT < BOOT_LEN) bootT += dt;
  updateScene(dt);
  renderLCD();
  const k = cvs.width / BW;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, BW, BH);
  drawPanel();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- ratón / táctil
function setBypass(v) { bypass = v; document.getElementById("bypass").classList.toggle("on", bypass); }
document.getElementById("bypass").onclick = () => setBypass(!bypass);
function cyclePalette() { palIdx = (palIdx + 1) % PALETTES.length; pillFlash.select = 0.15; try { localStorage.setItem("nicotina-pal", palIdx); } catch (e) {} }

let drag = null;
const toPage = e => { const r = cvs.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; };
const toLocal = e => { const q = toPage(e); return { x: q.x, y: q.y - OY }; };
const inPower = p => p.x > 48 && p.x < 146 && p.y > 4 && p.y < 28;
function togglePower() { powerOn = !powerOn; if (powerOn) bootT = 0; }
const inCart = q => q.x > 132 && q.x < 348 && q.y > 0 && q.y < OY + 4;
const inModeBar = p => p.x > SCR.x && p.x < SCR.x + 96 * 2 && p.y > SCR.y && p.y < SCR.y + 22;
function whatIsAt(e) {
  const q = toPage(e), p = toLocal(e);
  if (inCart(q)) return "cart";
  if (inPower(p)) return "power";
  if (inModeBar(p)) return "mode";
  const k = hitKnob(p); if (k) return k.id;
  const pl = hitPill(p); if (pl) return pl.id;
  return null;
}
function cycleMode(d) { modeIdx = (modeIdx + d + MODES.length) % MODES.length; }
const hitKnob = p => knobs.find(k => Math.hypot(p.x - k.cx, p.y - k.cy) < (k.big ? k.r + 20 : k.r + 8));
const hitPill = p => pills.find(q => Math.hypot(p.x - q.cx, p.y - q.cy) < 22);
cvs.addEventListener("pointerdown", e => {
  const p = toLocal(e);
  const pl = hitPill(p);
  if (pl) { if (pl.id === "select") cyclePalette(); else setBypass(!bypass); return; }
  const q = toPage(e);
  if (inCart(q)) { loadPreset(presetIdx + (q.x < 240 ? -1 : 1)); return; }
  if (inPower(p)) { togglePower(); return; }
  if (inModeBar(p)) { cycleMode(p.x < SCR.x + 48 ? -1 : 1); return; }
  const k = hitKnob(p); if (!k) return;
  drag = { k, y: e.clientY, n: toNorm(params[k.id], params[k.id].v) };
  cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener("pointermove", e => {
  const p = toLocal(e);
  hover = drag ? drag.k.id : whatIsAt(e);
  cvs.style.cursor = drag || hitKnob(p) ? "ns-resize" : (hover ? "pointer" : "default");
  if (!drag) return;
  const sens = (drag.k.big ? 260 : 200) * scale * (e.shiftKey ? 4 : 1);
  params[drag.k.id].v = fromNorm(params[drag.k.id], clamp(drag.n + (drag.y - e.clientY) / sens, 0, 1));
});
cvs.addEventListener("pointerup", () => drag = null);
cvs.addEventListener("pointerleave", () => { if (!drag) hover = null; });
cvs.addEventListener("dblclick", e => { const k = hitKnob(toLocal(e)); if (k) params[k.id].v = params[k.id].def; });
cvs.addEventListener("wheel", e => {
  const k = hitKnob(toLocal(e)); if (!k) return; e.preventDefault();
  const p = params[k.id]; p.v = fromNorm(p, toNorm(p, p.v) - Math.sign(e.deltaY) * 0.02);
}, { passive: false });

// ---------------------------------------------------------------- arranque
try { const s = parseInt(localStorage.getItem("nicotina-pal")); if (s >= 0 && s < PALETTES.length) palIdx = s; } catch (e) {}
