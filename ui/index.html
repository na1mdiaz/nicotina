  if (e.key >= "1" && e.key <= "5" && !e.ctrlKey) S.tab = TABS[+e.key - 1][0];
  if (e.key === "Escape") { S.assign = null; G.on = false; }
});


// ---------------------------------------------------------------- puente con el plugin (JUCE)
const PSYNC = { last: {}, lastCx: "", n: 0, ready: false, tab: "" };
function flatParams() {
  const o = {}; for (const d of DEF) o[d[0]] = P[d[0]];
  o.xyx = XY.x; o.xyy = XY.y; o.freeze = S.freeze ? 1 : 0; o.rfreeze = S.rfreeze ? 1 : 0; o.bypass = S.bypass ? 1 : 0;
  return o;
}
function complexJson() { return JSON.stringify({ PAT, MODS: { A: MODS.A, B: MODS.B, SEG: MODS.SEG }, ASSIGN, mask: S.mask, quant: S.quant, scaleIdx: S.scaleIdx, strain: S.strain, gpat: S.gpat, mixLock: S.mixLock }); }
function applyIncoming(id, v) {
  if (id === "xyx") XY.x = v; else if (id === "xyy") XY.y = v;
  else if (id === "freeze") S.freeze = v > 0.5; else if (id === "rfreeze") S.rfreeze = v > 0.5; else if (id === "bypass") S.bypass = v > 0.5;
  else if (id in P) P[id] = v;
  PSYNC.last[id] = v;
}
function pluginSync() {
  if (!PSYNC.ready) return;
  const f = flatParams(), ch = {}; let any = false;
  for (const k in f) { if (k === "bpm" && hostBpm > 0) continue; if (PSYNC.last[k] !== f[k]) { ch[k] = f[k]; PSYNC.last[k] = f[k]; any = true; } }
  if (any) BK.emitEvent("setParams", ch);
  if ((++PSYNC.n % 6) === 0) { const j = complexJson(); if (j !== PSYNC.lastCx) { PSYNC.lastCx = j; BK.emitEvent("setState", { json: j }); } }
  if (S.tab !== PSYNC.tab) { PSYNC.tab = S.tab; BK.emitEvent("view", { tab: S.tab }); }
}
function pluginInit() {
  playing = true;
  GUIDE[0] = { tab: "cultivo", r: [818, 12, 282, 48], t: "1 · EN FL STUDIO", d: "MUTAGEN va en el Mixer, en un slot del canal de tu sinte o melodía. Dale al play en FL: los cortes y las curvas se sincronizan solos con el tempo y el compás de tu proyecto. Todo se guarda con el proyecto." };
  BK.addEventListener("state", st => {
    if (st.fresh) { loadStrain(1, false); PSYNC.last = {}; PSYNC.lastCx = ""; }
    else {
      for (const k in st.P) applyIncoming(k, st.P[k]);
      if (st.complex) { try { const o = JSON.parse(st.complex); if (o.PAT) PAT = o.PAT; if (o.MODS) modRestore({ MODS: o.MODS }); if (o.ASSIGN) modRestore({ ASSIGN: o.ASSIGN }); if (o.mask) S.mask = o.mask; if ("quant" in o) S.quant = o.quant; if ("scaleIdx" in o) S.scaleIdx = o.scaleIdx; if ("strain" in o) S.strain = o.strain; if ("gpat" in o) S.gpat = o.gpat; if ("mixLock" in o) S.mixLock = o.mixLock; } catch (e) {} PSYNC.lastCx = st.complex; }
    }
    if (st.bpm > 0) hostBpm = st.bpm;
    PSYNC.ready = true;
  });
  BK.addEventListener("params", ps => { for (const k in ps) applyIncoming(k, ps[k]); });
  BK.addEventListener("viz", v => {
    ui.level = v.level; ui.inRms = v.inRms; ui.outRms = v.outRms; ui.mk = v.mk; ui.gr = v.gr; ui.lim = v.lim;
    ui.step = v.step; ui.stepFrac = v.stepFrac; ui.activeGrains = v.ag; hostPlaying = !!v.playing;
    if (v.bpm > 0) { hostBpm = v.bpm; P.bpm = Math.round(v.bpm); PSYNC.last.bpm = P.bpm; }
    for (const k of SRC) MV[k] = v.mv[k];
    if (v.ph) { RT.A.ph = v.ph[0]; RT.B.ph = v.ph[1]; }
    for (const d of DEF) Q[d[0]] = P[d[0]];
    for (const k in v.q) if (k in Q) Q[k] = v.q[k];
    const now = performance.now();
    for (const g of v.ge || []) {
      if (ui.grains.length < 200) ui.grains.push({ posN: g[0], st: g[1], len: g[2], pan: g[3], rev: !!g[4], born: now });
      if (ui.sparks.length < 60) ui.sparks.push({ st: g[1], rev: !!g[4], born: now, r: Math.random(), len: g[2] });
    }
    if (v.scIn) { ui.scIn.set(v.scIn.slice(0, SCN)); ui.scOut.set(v.scOut.slice(0, SCN)); }
    if (v.env) vizEnv = v.env;
  });
  BK.emitEvent("ready", {});
}

// ---------------------------------------------------------------- arranque
fit();
if (IS_PLUGIN) pluginInit(); else loadStrain(1, false);
Promise.all([document.fonts.load(F.logo(24)), document.fonts.load(F.ui(12, 700)), document.fonts.load(F.ui(12, 500)), document.fonts.load(F.mono(12)), document.fonts.load(F.jp(12), "変異")])
  .catch(() => {}).finally(() => { bgTex = null; requestAnimationFrame(frame); });
</script>
