cvs.addEventListener("pointermove", e => { const p = toL(e); if (drag) { const v = clamp(drag.v + (drag.y - p.y) / 260, 0, 1); if (drag.id === "mix") S.mix = v; else S.k = v; return; } hover = hitAt(p); cvs.style.cursor = hover ? (hover.kind === "knob" ? "ns-resize" : "pointer") : "default"; });
cvs.addEventListener("pointerup", () => { drag = null; });
cvs.addEventListener("wheel", e => { const h = hitAt(toL(e)); if (h && h.kind === "knob") { e.preventDefault(); if (h.id === "mix") S.mix = clamp(S.mix - e.deltaY / 1500, 0, 1); else S.k = clamp(S.k - e.deltaY / 1500, 0, 1); } }, { passive: false });
cvs.addEventListener("dblclick", e => { const h = hitAt(toL(e)); if (h && h.kind === "knob") { if (h.id === "mix") S.mix = PRESETS[S.preset].mix; else S.k = 0; } });
window.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); play(S.playing ? "stop" : S.src || "voz"); } if (e.code === "ArrowUp") S.k = clamp(S.k + 0.02, 0, 1); if (e.code === "ArrowDown") S.k = clamp(S.k - 0.02, 0, 1); });

// ------------------------------------------------------------------ puente con el plugin (FL Studio)
let PLUGIN_BPM = 0;
if (IS_PLUGIN) {
  const BK = window.__JUCE__.backend, PM = { k: { get: () => +(S.k), set: val => { S.k = val; } }, mix: { get: () => +(S.mix), set: val => { S.mix = val; } }, preset: { get: () => +(S.preset), set: val => { S.preset = val; } }, bypass: { get: () => +(S.bypass), set: val => { S.bypass = val > 0.5; } } }, last = {}; let got = false;
  S.playing = true;
  BK.addEventListener("params", o => { for (const k in o) if (PM[k]) { const val = +o[k]; PM[k].set(val); last[k] = PM[k].get();  } got = true; });
  BK.addEventListener("viz", v => { S.inL = v.inL; S.outL = v.outL; S.lv = v.lv; DSP.gr = v.gr; S.louder = v.louder; if (v.bpm) PLUGIN_BPM = v.bpm; S.playing = true; });
  setInterval(() => { if (!got) return; const ch = {}; let any = false; for (const k in PM) { const val = PM[k].get(); if (last[k] === undefined || Math.abs(val - last[k]) > 1e-6) { ch[k] = val; last[k] = val; any = true; } } if (any) BK.emitEvent("setParams", ch); }, 30);
  BK.emitEvent("ready", {});
}
</script>
